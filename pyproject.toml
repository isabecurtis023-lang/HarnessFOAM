[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "HarnessFOAM"
version = "0.1.0"
description = "An End-to-End Composable Multi-Agent Framework for Automating CFD Simulation in OpenFOAM"
readme = "README.md"
authors = [
    {name = "Isabel Curtis"}
]
dependencies = [
    "langgraph>=0.0.26",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "pydantic>=2.0",
    "faiss-cpu>=1.7.4",
    "gmsh>=4.11.1",
    "pyvista>=0.42.3",
    "mcp>=1.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0"
]

[project.scripts]
harnessfoam = "harnessfoam.main:app"
