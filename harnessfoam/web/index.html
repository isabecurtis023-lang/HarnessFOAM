<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarnessFOAM Web Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Input Area -->
        <aside class="control-panel">
            <header>
                <h1>HarnessFOAM</h1>
                <p>AI-Powered CFD Automation</p>
            </header>
            
            <div class="input-group">
                <label for="prompt">Simulation Requirement</label>
                <textarea id="prompt" placeholder="e.g. Simulate incompressible flow over a circular cylinder at 2 m/s..."></textarea>
            </div>
            
            <div class="input-group">
                <label for="output_dir">Project Output Directory</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="output_dir" value="demo_run_web" style="flex: 1;">
                    <button id="browse-btn" class="secondary-btn" style="padding: 0.5rem 1rem; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;">Browse...</button>
                </div>
            </div>
            
            <div class="api-settings-panel" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.05);">
                <h3 style="font-size: 0.85rem; margin-bottom: 0.75rem; color: #a78bfa;">⚙️ Model API Settings</h3>
                <div class="input-group" style="margin-bottom: 0.5rem;">
                    <label for="api_base">API Base URL</label>
                    <input type="text" id="api_base" placeholder="e.g. https://api.openai.com/v1">
                </div>
                <div class="input-group" style="margin-bottom: 0.5rem;">
                    <label for="model_name">Model Name</label>
                    <input type="text" id="model_name" placeholder="e.g. gpt-4o or minimax-m27">
                </div>
                <div class="input-group" style="margin-bottom: 0;">
                    <label for="api_key">API Key</label>
                    <input type="password" id="api_key" placeholder="sk-...">
                </div>
            </div>
            
            <button id="run-btn" class="primary-btn">Initialize Simulation</button>
            
            <div class="status-indicator">
                <div class="dot" id="connection-dot"></div>
                <span id="connection-status">Disconnected</span>
            </div>
        </aside>
        
        <!-- Main Terminal / Chat Area -->
        <main class="terminal-container">
            <div class="terminal-header">
                <div class="mac-buttons">
                    <span class="close"></span>
                    <span class="minimize"></span>
                    <span class="maximize"></span>
                </div>
                <div class="terminal-title">Agentic Workflow Console</div>
            </div>
            <div class="terminal-body" id="console-output">
                <div class="log-entry system">Welcome to HarnessFOAM v0.1.0 Web Interface.</div>
                <div class="log-entry system">Ready to process CFD specifications.</div>
            </div>
        </main>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
