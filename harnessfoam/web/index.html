<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarnessFOAM Web Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Input Area -->
        <aside class="control-panel">
            <header style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <h1>HarnessFOAM</h1>
                    <p>AI-Powered CFD Automation</p>
                </div>
                <button id="settings-btn" style="background: transparent; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s;" title="API Settings">⚙️</button>
            </header>
            
            <div class="input-group">
                <label for="prompt">Simulation Requirement</label>
                <textarea id="prompt" placeholder="e.g. Simulate incompressible flow over a circular cylinder at 2 m/s...">Simulate incompressible flow over a circular cylinder at 2 m/s. Use a 2D domain. The cylinder radius is 0.05m.</textarea>
            </div>
            
            <div class="input-group">
                <label for="post_prompt">Post-Processing Requirement (Optional)</label>
                <textarea id="post_prompt" placeholder="e.g. Plot the velocity magnitude and save as PNG..." style="height: 60px;">Plot the velocity magnitude and save as PNG.</textarea>
            </div>
            
            <div class="input-group">
                <label for="output_dir">Project Output Directory</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="output_dir" value="demo_run_web" style="flex: 1;">
                    <button id="browse-btn" class="secondary-btn" style="padding: 0.5rem 1rem; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;">Browse...</button>
                </div>
            </div>
            
            <button id="run-btn" class="primary-btn">Initialize Simulation</button>
            
            <div class="status-indicator">
                <div class="dot" id="connection-dot"></div>
                <span id="connection-status">Disconnected</span>
            </div>
        </aside>
        
        <!-- API Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Model API Settings</h2>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">Override the local `.env` variables for this session.</p>
                    <div class="input-group">
                        <label for="api_base">API Base URL</label>
                        <input type="text" id="api_base" placeholder="e.g. https://api.openai.com/v1">
                    </div>
                    <div class="input-group">
                        <label for="api_key">API Key</label>
                        <input type="password" id="api_key" placeholder="sk-...">
                    </div>
                    <div class="input-group">
                        <label for="model_name">Model Name</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="text" id="model_name" list="model-list" placeholder="e.g. gpt-4o or minimax-m27" style="flex: 1;">
                            <button id="fetch-models-btn" class="secondary-btn" style="padding: 0.5rem; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer;" title="Auto-detect models">🔄</button>
                        </div>
                        <datalist id="model-list"></datalist>
                        <div id="model-fetch-status" style="font-size: 0.75rem; color: #10b981; margin-top: 0.25rem;"></div>
                    </div>
                    <button id="save-settings-btn" class="primary-btn" style="width: 100%; margin-top: 0.5rem;">Save Settings</button>
                </div>
            </div>
        </div>
        
        <!-- Main Terminal / Chat Area -->
        <main class="terminal-container">
            <div class="terminal-header">
                <div class="mac-buttons">
                    <span class="close"></span>
                    <span class="minimize"></span>
                    <span class="maximize"></span>
                </div>
                <div class="terminal-title">Agentic Workflow Console</div>
            </div>
            <div class="terminal-body" id="console-output">
                <div class="log-entry system">Welcome to HarnessFOAM v0.1.0 Web Interface.</div>
                <div class="log-entry system">Ready to process CFD specifications.</div>
            </div>
        </main>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
